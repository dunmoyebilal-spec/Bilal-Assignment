<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login Bills </title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="Login-box">
    <div class="logo">
        <img src="bill logo.png" alt="logo">
    </div>
    <h1>LOGIN</h1>
    <form>
        <div class="input-box">
            <input type="text" placeholder="Enter Phone No/Email">
        </div>
        <div class="input-box">
            <input type="password" placeholder="Enter password">
        </div>
        <div class="options">
            <label>
                <input type="checkbox">
                Remember Me
            </label>
            <a href="">Forgot Password?</a>
        </div>
        <button type="submit">LOGIN</button>

        <p>
            Don't have an account ?
            <a href="">Sign Up</a>
        </p>
    </form>
    
</div>
</body>
</html>
