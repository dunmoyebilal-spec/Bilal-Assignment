<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up Bills Banking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div  class="Login-box">
        <div class="logo">
            <img src="bill logo.png" alt="logo">
        </div>
         <h1>Sign Up</h1>
    <form>
        <div class="input-box">
            <input type="number" placeholder="Enter Phone No" required>
        </div>
        <div class="input-box">
            <input type="email" placeholder=" Enter Email" required>
        </div>
        <div class="input-box">
            <input type="number" placeholder="Enter Your BVN" required>
        </div>
        <div class="input-box">
            <input type="number" placeholder="Enter Your NIN" required>
        </div>
        <div class="input-box">
            <input type="password" placeholder="Enter password" required>
        </div>
        <div class="input-box">
            <input type="password" placeholder="Confirm password" required>
        </div>
        <button type="submit">Sign Up</button>
        <p>
        <a href="index.html">Have An Account</a>
        </p>
    </form>
    </div>
</body>
</html>
